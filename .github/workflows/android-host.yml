name: Android Host (Kotlin + Godot)

on:
  push:
    branches:
      - migration/kotlin-godot
    paths:
      - "project.godot"
      - "*.gd"
      - "main.tscn"
      - "android-host/**"
      - ".github/workflows/android-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Godot project assets
        run: |
          mkdir -p android-host/app/src/main/assets
          cp project.godot main.tscn main.gd hero.gd human.gd war.gd android-host/app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK and release App Bundle
        run: |
          gradle -p android-host :app:assembleDebug :app:bundleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-android-multi-abi
          path: |
            android-host/app/build/outputs/apk/debug/*.apk
            android-host/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
