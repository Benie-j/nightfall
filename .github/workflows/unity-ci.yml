name: Unity - verification et tests

# Lancement manuel uniquement.
on:
  workflow_dispatch:

jobs:
  static-check:
    name: Controles statiques (PAS une compilation C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/check_csharp_static.py UnityProject/Assets
      - run: python3 tools/verify_unity_project.py UnityProject
      - run: python3 tools/tests/test_osm_to_unity.py
      - name: JSON de campagne valides
        run: |
          python3 - <<'PY'
          import json, glob
          for f in glob.glob("UnityProject/Assets/Nightfall/Resources/Data/*.json"):
              json.load(open(f, encoding="utf-8")); print("OK", f)
          PY
      - name: YAML des workflows
        run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/unity-*.yml')]; print('YAML OK')"

  unity-tests:
    name: Tests Unity ${{ matrix.mode }}
    needs: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
      - name: Licence Unity (echec explicite si absente)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Ni UNITY_LICENSE ni UNITY_SERIAL. Voir UNITY_LICENSE_SETUP.md."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-tests-${{ hashFiles('UnityProject/Packages/manifest.json', 'UnityProject/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-
      - name: Tests ${{ matrix.mode }}
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: UnityProject
          unityVersion: auto
          testMode: ${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results-${{ matrix.mode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
