name: Godot Android Export

on:
  push:
    branches: [feat/visual-rework]
    paths:
      - "project.godot"
      - "*.gd"
      - "*.glb"
      - "*.jpg"
      - "*.png"
      - "*.tscn"
      - "assets/**"
      - "export_presets.cfg"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build

          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable/. \
              ~/.local/share/godot/export_templates/
          fi

          keytool -genkeypair -v \
            -keystore ~/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > ~/.config/godot/editor_settings-4.tres <<'SETTINGS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import Godot resources
        run: godot --headless --editor --path . --import

      - name: Validate project resources
        shell: bash
        run: |
          set -euo pipefail
          for f in project.godot main.tscn main.gd war.gd \
                   weapon.gd hero.gd hero.glb; do
            test -s "$f" || {
              echo "Ressource manquante : $f"
              exit 1
            }
          done

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/nightfall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-godot-apk
          path: build/nightfall.apk
          if-no-files-found: error
