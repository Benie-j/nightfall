name: APK Godot (32 et 64 bits)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2
      - name: Import
        run: godot --headless --import || true
      - name: Test de démarrage (détecte les erreurs de script)
        run: |
          timeout 120 godot --headless --path . --quit-after 90 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then
            echo "::error::Erreur de script détectée (voir le log ci-dessus)"
            exit 1
          fi
      - name: Export
        run: godot --headless --export-debug "Android" build/nightfall.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-godot-apk
          path: build/nightfall.apk
