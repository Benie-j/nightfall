name: APK Godot (32 et 64 bits)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python pour la carte
        run: |
          apt-get update
          apt-get install -y python3 curl

      - name: Télécharger et vérifier les modèles 3D
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/cktang88/3d-fps/130ac2a5c856401ec36e7d35afcfefe40c5801f4/public/assets"
          mkdir -p assets/external

          curl -fL --retry 3 "$BASE/models/characters/soldier.glb" -o assets/external/soldier.glb
          curl -fL --retry 3 "$BASE/models/fp/m4a1.glb" -o assets/external/m4a1_fp.glb
          curl -fL --retry 3 "$BASE/models/props/covered_car/covered_car.glb" -o assets/external/covered_car.glb

          python3 - <<'PYMODEL'
          import json, struct
          from pathlib import Path

          for p in map(Path, [
              "assets/external/soldier.glb",
              "assets/external/m4a1_fp.glb",
              "assets/external/covered_car.glb"
          ]):
              d = p.read_bytes()
              if len(d) < 20:
                  raise SystemExit(f"Fichier invalide : {p}")
              magic, version, total = struct.unpack_from("<4sII", d)
              length, kind = struct.unpack_from("<II", d, 12)
              if magic != b"glTF" or version != 2 or total != len(d) or kind != 0x4E4F534A:
                  raise SystemExit(f"GLB invalide : {p}")
              doc = json.loads(d[20:20+length].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
              skins = len(doc.get("skins", []))
              animations = [a.get("name", "?") for a in doc.get("animations", [])]
              if p.name == "soldier.glb" and skins == 0:
                  raise SystemExit("Le soldat n'a pas de squelette.")
              print(f"OK {p}: {len(d)} octets, {skins} squelette(s), animations={animations}")
          PYMODEL

          cat > assets/external/ASSET_CREDITS.txt <<'EOF'
          Ressources NIGHTFALL
          Source : cktang88/3d-fps
          Commit : 130ac2a5c856401ec36e7d35afcfefe40c5801f4
          soldier.glb : BAMEN - CC BY 4.0
          m4a1_fp.glb : Firewarden / bumstrum - CC BY 4.0
          covered_car.glb : Poly Haven - CC0
          https://github.com/cktang88/3d-fps
          EOF

      - name: Extraire les données de Yopougon
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_yopougon_map.py
          test -s data/yopougon_siporex_ficgayo.json

      - name: Publier les données cartographiques
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-yopougon-map-source
          path: |
            data/yopougon_siporex_ficgayo.json
            data/OPENSTREETMAP_ATTRIBUTION.txt

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2
      - name: Import
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --import 2>&1 | tee godot-import.log
          if grep -E "ERROR: GLTF:|ERROR: Error importing|SCRIPT ERROR:|Parse Error" godot-import.log; then
            echo "Importation Godot invalide."
            exit 1
          fi
      - name: Test de démarrage (détecte les erreurs de script)
        shell: bash
        run: |
          timeout 120 godot --headless --path . --quit-after 90 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" smoke.log; then
            echo "::error::Erreur de script détectée (voir le log ci-dessus)"
            exit 1
          fi
      - name: Export
        run: godot --headless --export-debug "Android" build/nightfall.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-godot-apk
          path: build/nightfall.apk
